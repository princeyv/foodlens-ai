name: core_nutrition_app
description: "Camera-first social nutrition tracking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State management — standard Riverpod
  flutter_riverpod: ^2.5.1

  # Camera — native camera plugin (NO image_picker)
  camera: ^0.11.0

  # Sensor fusion
  pedometer: ^4.0.1
  geolocator: ^12.0.0

  # Runtime permissions
  permission_handler: ^11.3.0

  # UI — card swiper for ingredient confirmation
  flutter_card_swiper: ^7.2.0

  # Backend — Supabase
  supabase_flutter: ^2.6.0

  # AI — Gemini vision for meal analysis
  google_generative_ai: ^0.4.0

  # Networking
  dio: ^5.4.3+1
  http: ^1.2.0

  # Image processing (used in isolate for resize/compress)
  image: ^4.2.0

  # File system
  path_provider: ^2.1.3
  uuid: ^4.5.1

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env

dependency_overrides:
  camera_android_camerax: ^0.7.5